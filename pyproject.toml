[project]
name = "q-caliper"
version = "1.0.4"
description = "质量工程桌面分析平台 — Minitab 精华功能的开源替代品"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "PySide6-Fluent-Widgets>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyDOE2>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "nuitka>=2.0",
    "ordered-set>=4.1",
]

[project.scripts]
q-caliper = "q_caliper.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["q_caliper*"]
