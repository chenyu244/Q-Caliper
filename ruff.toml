# Ruff configuration for Q-Caliper
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", # ambiguous unicode chars (Chinese UI strings)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "N802",   # function name should be lowercase (Qt overrides)
    "N815",   # mixedCase variable (pyqtSignal)
    "TC002",  # move third-party import to TYPE_CHECKING (UI files need runtime imports)
]

[lint.isort]
known-first-party = ["q_caliper"]

[format]
quote-style = "double"
indent-style = "space"
